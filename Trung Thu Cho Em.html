<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trung Thu Của Bọn Mình</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Mali', cursive !important;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 5px white; }
        }

        .moon {
            width: 160px;
            height: 160px;
            background: #fffde8;
            border-radius: 50%;
            box-shadow: 0 0 50px #fffde8, inset -20px -20px 40px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.4s ease;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .moon:hover, .moon:active {
            transform: scale(1.05);
            box-shadow: 0 0 80px #fffde8, inset -20px -20px 40px rgba(0,0,0,0.1);
        }

        .moon-crater {
            position: absolute;
            background: rgba(0,0,0,0.05);
            border-radius: 50%;
        }

        .lantern-container {
            position: absolute;
            top: -20px;
            transform-origin: top center;
            animation: sway infinite ease-in-out alternate;
            z-index: 5;
        }

        .lantern {
            width: 45px;
            height: 65px;
            background: radial-gradient(circle at 30% 30%, #ff5e5e, #c20000);
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(255, 75, 75, 0.6);
            position: relative;
        }

        .lantern::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 8px;
            background: #ffd700;
            border-radius: 2px;
        }

        .lantern::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 25px;
            background: repeating-linear-gradient(to right, #ffd700, #ffd700 2px, transparent 2px, transparent 4px);
        }

        .string {
            position: absolute;
            top: -100px;
            left: 50%;
            width: 2px;
            height: 100px;
            background: rgba(255,255,255,0.2);
        }

        @keyframes sway {
            0% { transform: rotate(-6deg); }
            100% { transform: rotate(6deg); }
        }

        .msg-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            z-index: 20;
            transition: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 85%;
            max-width: 380px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.1);
            opacity: 0;
            pointer-events: none;
        }

        .msg-box.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .glow-text {
            text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px #ffdf00;
        }

        .hint {
            position: absolute;
            bottom: -40px;
            width: 200px;
            text-align: center;
            font-size: 14px;
            color: #ffd700;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; text-shadow: 0 0 10px #ffd700; }
        }
        
        .firefly {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #a8ff78;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px #a8ff78;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) translateX(20px); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="[files]" type="audio/mpeg">
    </audio>

    <div id="stars"></div>
    <div id="fireflies"></div>

    <div class="lantern-container" style="left: 15%; animation-duration: 3.5s; animation-delay: 0s;">
        <div class="string"></div>
        <div class="lantern"></div>
    </div>
    <div class="lantern-container" style="left: 35%; animation-duration: 4s; animation-delay: 1s; transform: scale(0.8); top: -30px;">
        <div class="string"></div>
        <div class="lantern"></div>
    </div>
    <div class="lantern-container" style="right: 35%; animation-duration: 3.2s; animation-delay: 0.5s; transform: scale(0.9); top: -25px;">
        <div class="string"></div>
        <div class="lantern"></div>
    </div>
    <div class="lantern-container" style="right: 15%; animation-duration: 3.8s; animation-delay: 1.5s;">
        <div class="string"></div>
        <div class="lantern"></div>
    </div>

    <div class="moon" id="moonBtn">
        <div class="moon-crater" style="width: 30px; height: 30px; top: 20px; left: 40px;"></div>
        <div class="moon-crater" style="width: 20px; height: 20px; bottom: 30px; right: 40px;"></div>
        <div class="moon-crater" style="width: 40px; height: 40px; top: 60px; right: 20px;"></div>
        <span class="text-[#b38500] font-bold text-lg px-2" id="moonText">Chạm vào trăng nhé 🌕</span>
        <div class="hint" id="hintText">Bật âm lượng lên nha bé...</div>
    </div>

    <div class="msg-box" id="messageBox">
        <h1 class="text-3xl font-bold mb-4 text-[#ffd700] glow-text">Trung Thu Vui Vẻeee🏮</h1>
        <p class="text-lg leading-relaxed mb-6">
            Chúc bé bầu trời đêm nay ngập tràn ánh sao, và trái tim ngập tràn tình yêu của anh ❤️<br><br>
            Ngắm trăng trên trời xong rồi thì nhớ ngắm anh nha. Yêu cục cưng nhiềuuuu🥰
        </p>
        <button id="closeBtn" class="bg-gradient-to-r from-[#ff4b4b] to-[#ff8000] text-white px-6 py-2 rounded-full font-bold shadow-lg transform transition hover:scale-110 active:scale-95">
            Dạ yêu anhhh 😘
        </button>
    </div>

    <script>
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            let size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsContainer.appendChild(star);
        }

        const firefliesContainer = document.getElementById('fireflies');
        for (let i = 0; i < 20; i++) {
            let ff = document.createElement('div');
            ff.className = 'firefly';
            ff.style.left = Math.random() * 100 + 'vw';
            ff.style.animationDuration = (Math.random() * 5 + 5) + 's';
            ff.style.animationDelay = Math.random() * 5 + 's';
            firefliesContainer.appendChild(ff);
        }

        const moonBtn = document.getElementById('moonBtn');
        const messageBox = document.getElementById('messageBox');
        const closeBtn = document.getElementById('closeBtn');
        const bgMusic = document.getElementById('bgMusic');
        const moonText = document.getElementById('moonText');
        const hintText = document.getElementById('hintText');
        let isOpened = false;

        moonBtn.addEventListener('click', () => {
            if (!isOpened) {
                bgMusic.play().catch(()=>{});
                moonBtn.style.transform = 'scale(0.5)';
                moonBtn.style.opacity = '0';
                setTimeout(() => {
                    messageBox.classList.add('show');
                }, 300);
                isOpened = true;
            }
        });

        closeBtn.addEventListener('click', () => {
            messageBox.classList.remove('show');
            setTimeout(() => {
                moonBtn.style.transform = 'scale(1)';
                moonBtn.style.opacity = '1';
                moonText.innerHTML = '❤️';
                hintText.style.display = 'none';
            }, 500);
            isOpened = false;
        });
    </script>
</body>
</html>
